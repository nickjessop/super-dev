<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Viewer — Super Dev</title>
  
  <!-- CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>

  <style>
    :root {
      --bg-canvas: #0f1117;
      --bg-surface: #161b22;
      --bg-subtle: #21262d;
      --bg-hover: #30363d;
      --border-color: #30363d;
      --border-subtle: #21262d;
      --text-main: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent-blue: #388bfd;
      --accent-blue-bg: rgba(56, 139, 253, 0.15);
      --accent-green: #3fb950;
      --accent-green-bg: rgba(63, 185, 80, 0.15);
      --accent-red: #f85149;
      --accent-red-bg: rgba(248, 81, 73, 0.15);
      --accent-amber: #d29922;
      --accent-amber-bg: rgba(210, 153, 34, 0.15);
      --header-height: 48px;
      --sidebar-width: 260px;
      --inspector-width: 400px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Top Header Bar */
    #header {
      height: var(--header-height);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      user-select: none;
      z-index: 100;
      position: relative;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: var(--bg-subtle);
      border-color: var(--border-color);
      color: var(--text-bright);
    }
    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-bright);
    }
    .app-title svg {
      width: 18px;
      height: 18px;
      fill: var(--accent-blue);
    }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--border-color);
    }

    .doc-badge {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: var(--accent-blue);
      background: var(--accent-blue-bg);
      border: 1px solid rgba(56, 139, 253, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .live-dot.connected {
      background: var(--accent-green);
      box-shadow: 0 0 8px rgba(63, 185, 80, 0.6);
    }
    .live-dot.disconnected {
      background: var(--accent-red);
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-bright);
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-action:hover {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }
    .btn-action svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Main Container (3-Pane) */
    #app {
      display: flex;
      height: calc(100vh - var(--header-height));
      width: 100vw;
      position: relative;
      overflow: hidden;
    }

    /* Left Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      max-width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  min-width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  max-width 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease;
      z-index: 40;
      overflow: hidden;
      user-select: none;
    }

    #sidebar.collapsed {
      width: 0;
      min-width: 0;
      max-width: 0;
      border-right: none;
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }
    .sidebar-count {
      font-size: 11px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 10px;
    }

    .diagram-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .diagram-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .diagram-item:hover {
      background: var(--bg-subtle);
    }
    .diagram-item.active {
      background: var(--accent-blue-bg);
      border-color: rgba(56, 139, 253, 0.4);
    }
    .diagram-item .item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .diagram-item.active .item-title {
      color: #79c0ff;
    }
    .diagram-item .item-filename {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Center Viewport & Canvas */
    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(#30363d 1px, transparent 1px);
      background-size: 20px 20px;
      cursor: default;
      user-select: none;
    }

    body.space-pressed #viewport {
      cursor: grab !important;
    }
    body.is-dragging #viewport {
      cursor: grabbing !important;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: auto;
    }

    #canvas svg {
      overflow: visible;
      display: block;
    }

    /* Mermaid Node Active Highlight */
    .node-selected rect,
    .node-selected circle,
    .node-selected polygon,
    .node-selected path {
      stroke: #3b82f6 !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.7)) !important;
    }

    .node {
      cursor: pointer;
    }

    /* Floating Canvas Controls */
    #canvas-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-bright);
    }
    .ctrl-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .zoom-level {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--text-muted);
      padding: 0 6px;
      min-width: 44px;
      text-align: center;
      cursor: pointer;
    }
    .zoom-level:hover {
      color: var(--text-bright);
    }

    .canvas-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(22, 27, 34, 0.7);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease;
    }

    /* Right Inspector Drawer */
    #inspector {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--inspector-width);
      max-width: 90vw;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.4);
    }

    #inspector.open {
      transform: translateX(0);
    }

    .inspector-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .inspector-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .inspector-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .node-id-badge {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      background: var(--bg-subtle);
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 10px;
    }
    .status-badge.new {
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid rgba(63, 185, 80, 0.3);
    }
    .status-badge.existing {
      background: var(--accent-blue-bg);
      color: #79c0ff;
      border: 1px solid rgba(56, 139, 253, 0.3);
    }
    .status-badge.deprecated {
      background: var(--accent-red-bg);
      color: var(--accent-red);
      border: 1px solid rgba(248, 81, 73, 0.3);
    }
    .status-badge.neutral {
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .inspector-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      line-height: 1.3;
      word-break: break-word;
    }

    .inspector-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* Markdown Typography in Inspector */
    .inspector-body h1,
    .inspector-body h2,
    .inspector-body h3,
    .inspector-body h4 {
      color: var(--text-bright);
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 600;
      line-height: 1.3;
    }
    .inspector-body h1 { font-size: 16px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 4px; }
    .inspector-body h2 { font-size: 14px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 4px; }
    .inspector-body h3 { font-size: 13px; }
    .inspector-body p {
      margin-bottom: 12px;
    }
    .inspector-body ul, .inspector-body ol {
      padding-left: 20px;
      margin-bottom: 12px;
    }
    .inspector-body li {
      margin-bottom: 4px;
    }
    .inspector-body code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      background: var(--bg-subtle);
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    .inspector-body pre {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin-bottom: 12px;
    }
    .inspector-body pre code {
      background: transparent;
      padding: 0;
      border: none;
    }
    .inspector-body blockquote {
      border-left: 3px solid var(--accent-blue);
      padding-left: 10px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .inspector-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .inspector-body th, .inspector-body td {
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      text-align: left;
    }
    .inspector-body th {
      background: var(--bg-subtle);
      font-weight: 600;
    }

    .muted-note {
      color: var(--text-muted);
      font-style: italic;
    }

    /* States & Overlays */
    .empty-state, .error-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      max-width: 480px;
      padding: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .empty-state h3, .error-state h3 {
      font-size: 16px;
      color: var(--text-bright);
      margin-bottom: 8px;
    }
    .empty-state p, .error-state p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .error-state pre {
      margin-top: 12px;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--accent-red);
      border-radius: 6px;
      font-size: 11px;
      color: var(--accent-red);
      text-align: left;
      overflow-x: auto;
      max-height: 180px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      :root {
        --sidebar-width: 200px;
        --inspector-width: 320px;
      }
      .canvas-hint {
        display: none;
      }
      .app-title span {
        display: none;
      }
    }

    /* ─── Wave 3: Canvas Comments, Pins & Discussion Popovers ─── */
    .ctrl-divider {
      width: 1px;
      height: 16px;
      background: var(--border-color);
      margin: 0 2px;
    }

    #btn-tool-comment {
      font-size: 13px;
      position: relative;
    }
    #btn-tool-comment.active {
      background: var(--accent-blue-bg);
      border: 1px solid var(--accent-blue);
      color: #79c0ff;
      box-shadow: 0 0 8px rgba(56, 139, 253, 0.4);
    }

    body.comment-mode #viewport,
    body.comment-mode #canvas {
      cursor: crosshair !important;
    }

    /* End Discussion Header Button & Unresolved Badge */
    #btn-end-session {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-bright);
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    #btn-end-session:hover {
      background: var(--bg-hover);
      border-color: var(--accent-red);
      color: #ff7b72;
    }
    #btn-end-session.ended {
      opacity: 0.6;
      cursor: not-allowed;
      border-color: var(--border-color);
      color: var(--text-muted);
    }
    .end-icon {
      font-size: 11px;
      color: var(--accent-red);
      display: inline-flex;
      align-items: center;
    }
    .badge, #unresolved-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9px;
      background: var(--accent-amber);
      color: #0d1117;
      line-height: 1;
      margin-left: 2px;
      transition: background-color 0.2s ease;
    }
    #unresolved-badge.resolved-zero {
      background: var(--bg-hover);
      color: var(--text-muted);
    }

    /* Toast Notification Banner */
    #toast-banner {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      color: var(--text-bright);
      border: 1px solid var(--accent-blue);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 1000;
      display: none;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    #toast-banner.show {
      display: flex;
      animation: fadeInToast 0.25s ease-out;
    }
    @keyframes fadeInToast {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Comments Layer & Pins */
    #comments-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    .comment-pin {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      pointer-events: auto;
      user-select: none;
      z-index: 30;
    }
    .comment-pin:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }
    .comment-pin.open {
      background: linear-gradient(135deg, #388bfd, #1f6feb);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px rgba(56, 139, 253, 0.7);
    }
    .comment-pin.open.active {
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow: 0 0 16px rgba(56, 139, 253, 0.9);
      border-color: #79c0ff;
    }
    .comment-pin.resolved {
      background: linear-gradient(135deg, #2ea043, #238636);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 8px rgba(46, 160, 67, 0.5);
    }
    .comment-pin.resolved.active {
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow: 0 0 14px rgba(46, 160, 67, 0.8);
    }
    .comment-pin.draft {
      background: linear-gradient(135deg, #f0883e, #d29922);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(240, 136, 62, 0.8);
      animation: pinPulse 1.6s infinite ease-in-out;
    }
    @keyframes pinPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(240, 136, 62, 0.6); }
      50% { box-shadow: 0 0 18px rgba(240, 136, 62, 1); }
    }

    /* Discussion Card Popover */
    .comment-popover {
      position: absolute;
      width: 340px;
      max-width: 90vw;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      pointer-events: auto;
      z-index: 60;
      user-select: text;
      overflow: hidden;
      animation: popoverFadeIn 0.15s ease-out;
    }
    @keyframes popoverFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
    }
    .popover-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .popover-number {
      font-weight: 600;
      font-size: 12px;
      color: var(--text-bright);
    }
    .popover-node-badge {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      background: var(--accent-blue-bg);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 139, 253, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-pill.resolved {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid rgba(63, 185, 80, 0.3);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .popover-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-resolve {
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid rgba(63, 185, 80, 0.4);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-resolve:hover {
      background: var(--accent-green);
      color: #ffffff;
    }
    .btn-popover-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    .btn-popover-close:hover {
      color: var(--text-bright);
      background: var(--bg-hover);
    }

    .popover-body {
      padding: 10px 12px;
    }
    .popover-messages {
      max-height: 260px;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .comment-message {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
    }
    .comment-message.agent {
      background: rgba(56, 139, 253, 0.08);
      border: 1px solid rgba(56, 139, 253, 0.2);
    }
    .comment-message.user {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
    }
    .msg-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .msg-author {
      font-weight: 600;
      color: var(--text-bright);
    }
    .msg-time {
      color: var(--text-muted);
      font-size: 10px;
      margin-left: auto;
    }
    .msg-body {
      color: var(--text-main);
      word-break: break-word;
    }
    .msg-body p {
      margin-bottom: 4px;
    }
    .msg-body p:last-child {
      margin-bottom: 0;
    }
    .msg-body code {
      background: var(--bg-hover);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }
    .msg-body pre {
      background: #0d1117;
      padding: 6px 8px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 4px 0;
    }
    .msg-body pre code {
      background: transparent;
      padding: 0;
    }

    .agent-typing-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(56, 139, 253, 0.08);
      border: 1px dashed rgba(56, 139, 253, 0.3);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }
    .typing-dots {
      display: inline-flex;
      gap: 3px;
    }
    .typing-dots .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-blue);
      animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-dots .dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .popover-reply {
      padding: 8px 12px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }
    .reply-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-bright);
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      line-height: 1.4;
    }
    .reply-textarea:focus {
      border-color: var(--accent-blue);
    }
    .reply-actions, .draft-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-reply-send, .btn-submit {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn-reply-send:hover, .btn-submit:hover {
      opacity: 0.9;
    }
    .btn-cancel {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-cancel:hover {
      color: var(--text-bright);
      background: var(--bg-subtle);
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->

        <svg viewBox="0 0 16 16"><path d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 13.25 15H2.75A1.75 1.75 0 0 1 1 13.25Zm4.5 10.75V2.5h-2.75a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25Zm1.5 0h6.25a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25H7Z"></path></svg>

        <svg viewBox="0 0 16 16"><path d="M4.72 3.22a.75.75 0 0 1 1.06 1.06L2.06 8l3.72 3.72a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25Zm6.56 0a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L13.94 8l-3.72-3.72a.75.75 0 0 1 0-1.06Zm-4.996 9.88 2.5-10a.75.75 0 0 1 1.452.36l-2.5 10a.75.75 0 0 1-1.452-.36Z"></path></svg>

  <!-- Toast Notification Banner -->
  <div id="toast-banner" class="toast-banner">
    <span class="toast-icon">ℹ️</span>
    <span id="toast-message"></span>
  </div>

  <!-- 3-Pane Layout -->
  <main id="app">
    <!-- Left Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Diagrams</span>
        <span id="diagram-count" class="sidebar-count">0</span>

      <ul id="diagram-list" class="diagram-list">
        <!-- Rendered dynamically -->
      </ul>
    </aside>

    <!-- Center Canvas Viewport -->
    <section id="viewport">
      <div id="canvas">
        <div id="comments-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
      </div>

      <!-- Floating Controls -->
      <div id="canvas-controls">
        <button id="btn-tool-comment" class="ctrl-btn canvas-btn" title="Comment Tool (C)">💬</button>
        <div class="ctrl-divider"></div>
        <button id="btn-zoom-in" class="ctrl-btn" title="Zoom In (+)">
          <svg viewBox="0 0 16 16"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"></path></svg>
        </button>
        <button id="btn-zoom-out" class="ctrl-btn" title="Zoom Out (-)">
          <svg viewBox="0 0 16 16"><path d="M2 7.75A.75.75 0 0 1 2.75 7h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 7.75Z"></path></svg>

    <!-- Right Node Inspector Drawer -->

            <svg viewBox="0 0 16 16"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"></path></svg>

  <!-- Embedded Data Injection Point -->
  <script id="arch-data" type="application/json">
  {
    "activeId": "",
    "diagrams": []
  }
  </script>

  <!-- Viewer Application Script -->
  <script>
    (function() {
      'use strict';

      // ─── Initialize Libraries ──────────────────────────────────
      if (window.mermaid) {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'loose',
          fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
        });
      }

      // ─── Application State ─────────────────────────────────────
      const state = {
        diagrams: [],
        activeId: null,
        panX: 0,
        panY: 0,
        zoom: 1.0,
        isSpacePressed: false,
        isDragging: false,
        dragStartX: 0,
        dragStartY: 0,
        lastMouseX: 0,
        lastMouseY: 0,
        dragDistance: 0,
        sidebarCollapsed: false,
        selectedNodeEl: null,
        // Wave 3 discussion state
        commentModeActive: false,
        comments: [],
        activeCommentId: null,
        draftComment: null,
        agentTyping: new Set()
      };

      // ─── DOM Element References ────────────────────────────────
      const viewport = document.getElementById('viewport');
      const canvas = document.getElementById('canvas');
      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const diagramList = document.getElementById('diagram-list');
      const diagramCount = document.getElementById('diagram-count');
      const activeDocBadge = document.getElementById('active-doc-badge');
      const emptyState = document.getElementById('empty-state');
      
      const inspector = document.getElementById('inspector');
      const inspectorClose = document.getElementById('inspector-close');
      const inspectorTitle = document.getElementById('inspector-title');
      const inspectorNodeId = document.getElementById('inspector-node-id');
      const inspectorStatus = document.getElementById('inspector-status');
      const inspectorBody = document.getElementById('inspector-body');

      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');
      const btnZoomReset = document.getElementById('btn-zoom-reset');
      const btnFitView = document.getElementById('btn-fit-view');

      const btnToolComment = document.getElementById('btn-tool-comment');
      const btnEndSession = document.getElementById('btn-end-session');
      const unresolvedBadge = document.getElementById('unresolved-badge');

      const btnExportSvg = document.getElementById('btn-export-svg');
      const btnExportHtml = document.getElementById('btn-export-html');

      const liveDot = document.getElementById('live-dot');
      const liveText = document.getElementById('live-text');

      // ─── Discussion & Comment State Management ─────────────────
      function getCurrentDocFilename() {
        const diagram = state.diagrams.find(d => d.id === state.activeId);
        return diagram ? (diagram.filename || `${diagram.id}.md`) : 'overview.md';
      }

      function ensureCommentsLayer() {
        let layer = document.getElementById('comments-layer');
        if (!layer || !canvas.contains(layer)) {
          layer = document.createElement('div');
          layer.id = 'comments-layer';
          layer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;';
          canvas.appendChild(layer);
        }
        return layer;
      }

      function updateUnresolvedBadge() {
        if (!unresolvedBadge) return;
        const currentDoc = getCurrentDocFilename();
        const docThreads = state.comments.filter(t => 
          t.doc === currentDoc || 
          t.doc === `${currentDoc}.md` ||
          (t.doc && t.doc.endsWith('.json') && t.doc.slice(0, -5) === currentDoc)
        );
        const count = docThreads.filter(t => t.status !== 'resolved').length;
        unresolvedBadge.textContent = count;
        unresolvedBadge.classList.toggle('resolved-zero', count === 0);
      }

      let toastTimer = null;
      function showToast(message, duration = 4500) {
        const toast = document.getElementById('toast-banner');
        const msgEl = document.getElementById('toast-message');
        if (!toast || !msgEl) return;
        msgEl.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, duration);
      }

      function formatTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const now = new Date();
        const diffMs = now.getTime() - date.getTime();
        if (diffMs < 60000) return 'Just now';
        if (diffMs < 3600000) return `${Math.floor(diffMs / 60000)}m ago`;
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function toggleCommentMode(force) {
        state.commentModeActive = typeof force === 'boolean' ? force : !state.commentModeActive;
        if (btnToolComment) btnToolComment.classList.toggle('active', state.commentModeActive);
        document.body.classList.toggle('comment-mode', state.commentModeActive);
        if (!state.commentModeActive && state.draftComment) {
          cancelDraftComment();
        }
      }
      if (btnToolComment) {
        btnToolComment.addEventListener('click', () => toggleCommentMode());
      }

      async function endDiscussionSession() {
        try {
          const res = await fetch('/api/session/end', { method: 'POST' });
          if (res.ok) {
            showToast('Discussion ended. Agent is compiling the Architecture Decision Record...');
            if (btnEndSession) btnEndSession.classList.add('ended');
          }
        } catch (err) {
          console.error('Failed to end discussion session:', err);
        }
      }
      if (btnEndSession) {
        btnEndSession.addEventListener('click', endDiscussionSession);
      }

      async function loadDocComments(doc) {
        if (!doc) return;
        try {
          const res = await fetch(`/api/comments?doc=${encodeURIComponent(doc)}`);
          if (res.ok) {
            const threads = await res.json();
            if (Array.isArray(threads)) {
              state.comments = state.comments.filter(t => t.doc !== doc && t.doc !== `${doc}.md`).concat(threads);
            }
            updateUnresolvedBadge();
            renderComments();
          }
        } catch (err) {
          console.warn('Failed to load comments for doc:', doc, err);
        }
      }

      function findNodeElement(nodeId) {
        if (!nodeId) return null;
        try {
          const escaped = CSS.escape ? CSS.escape(nodeId) : nodeId;
          let el = canvas.querySelector(`g#flowchart-${escaped}, g[id^="flowchart-${escaped}-"]`);
          if (el) return el;
          el = canvas.querySelector(`g#${escaped}, [data-id="${escaped}"]`);
          if (el) return el;
        } catch (e) {}

        const nodes = canvas.querySelectorAll('.node, .cluster');
        for (const n of nodes) {
          if (extractNodeId(n) === nodeId) return n;
        }
        return null;
      }

      function addOrUpdateThread(thread) {
        if (!thread || !thread.id) return;
        const idx = state.comments.findIndex(t => t.id === thread.id);
        if (idx >= 0) {
          state.comments[idx] = thread;
        } else {
          state.comments.push(thread);
        }
        updateUnresolvedBadge();
      }

      function openDraftComment(x, y, nodeId) {
        state.draftComment = { x, y, nodeId };
        state.activeCommentId = null;
        renderComments();

        setTimeout(() => {
          const textarea = document.getElementById('draft-comment-text');
          if (textarea) textarea.focus();
        }, 50);
      }

      function cancelDraftComment() {
        state.draftComment = null;
        renderComments();
      }

      async function submitDraftComment() {
        if (!state.draftComment) return;
        const textarea = document.getElementById('draft-comment-text');
        const text = textarea ? textarea.value.trim() : '';
        if (!text) {
          cancelDraftComment();
          return;
        }

        const currentDoc = getCurrentDocFilename();
        const { x, y, nodeId } = state.draftComment;

        cancelDraftComment();
        toggleCommentMode(false);

        try {
          const payload = {
            doc: currentDoc,
            nodeId: nodeId || undefined,
            text,
            x: Math.round(x),
            y: Math.round(y),
            author: 'user',
            createdAt: Date.now()
          };
          const res = await fetch('/api/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const data = await res.json();
            if (data.success && data.thread) {
              addOrUpdateThread(data.thread);
              state.activeCommentId = data.thread.id;
              renderComments();
            }
          }
        } catch (err) {
          console.error('Failed to submit comment:', err);
        }
      }

      async function sendReply(threadId, text) {
        const trimmed = (text || '').trim();
        if (!trimmed) return;
        const currentDoc = getCurrentDocFilename();

        try {
          const payload = {
            id: threadId,
            doc: currentDoc,
            text: trimmed,
            author: 'user'
          };
          const res = await fetch('/api/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const data = await res.json();
            if (data.success && data.thread) {
              addOrUpdateThread(data.thread);
              renderComments();
            }
          }
        } catch (err) {
          console.error('Failed to send follow-up reply:', err);
        }
      }

      async function resolveThread(threadId) {
        const currentDoc = getCurrentDocFilename();
        try {
          const res = await fetch(`/api/comments/${encodeURIComponent(threadId)}/resolve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ doc: currentDoc })
          });
          if (res.ok) {
            const t = state.comments.find(c => c.id === threadId);
            if (t) {
              t.status = 'resolved';
            }
            state.agentTyping.delete(threadId);
            updateUnresolvedBadge();
            renderComments();
          }
        } catch (err) {
          console.error('Failed to resolve comment thread:', err);
        }
      }

      function renderComments() {
        const layer = ensureCommentsLayer();
        layer.innerHTML = '';

        const currentDoc = getCurrentDocFilename();
        const diagram = state.diagrams.find(d => d.id === state.activeId);

        // Filter threads for active diagram
        const docThreads = state.comments.filter(t => 
          t.doc === currentDoc || 
          t.doc === diagram?.filename || 
          t.doc === `${diagram?.id}.md` ||
          t.doc === diagram?.id
        );

        // 1. Render permanent comment pins
        docThreads.forEach((thread, index) => {
          let pinX = thread.x;
          let pinY = thread.y;

          if (thread.nodeId) {
            const nodeEl = findNodeElement(thread.nodeId);
            if (nodeEl) {
              const cRect = canvas.getBoundingClientRect();
              const nRect = nodeEl.getBoundingClientRect();
              if (nRect.width > 0 && nRect.height > 0) {
                pinX = (nRect.right - cRect.left) / state.zoom;
                pinY = (nRect.top - cRect.top) / state.zoom;
              }
            }
          }

          const isResolved = thread.status === 'resolved';
          const isActive = state.activeCommentId === thread.id;

          const pinEl = document.createElement('div');
          pinEl.className = `comment-pin ${isResolved ? 'resolved' : 'open'} ${isActive ? 'active' : ''}`;
          pinEl.style.left = `${pinX}px`;
          pinEl.style.top = `${pinY}px`;
          pinEl.title = `Comment #${index + 1}${thread.nodeId ? ' on ' + thread.nodeId : ''}`;
          pinEl.innerHTML = isResolved ? '✓' : `<span>${index + 1}</span>`;

          pinEl.addEventListener('click', (ev) => {
            ev.stopPropagation();
            state.activeCommentId = state.activeCommentId === thread.id ? null : thread.id;
            if (state.draftComment) state.draftComment = null;
            renderComments();
          });

          layer.appendChild(pinEl);

          if (isActive) {
            const popoverEl = createThreadPopover(thread, index, pinX, pinY);
            layer.appendChild(popoverEl);
          }
        });

        // 2. Render Draft Pin & Popover
        if (state.draftComment) {
          const { x, y, nodeId } = state.draftComment;
          const draftPin = document.createElement('div');
          draftPin.className = 'comment-pin draft active';
          draftPin.style.left = `${x}px`;
          draftPin.style.top = `${y}px`;
          draftPin.innerHTML = '💬';
          layer.appendChild(draftPin);

          const draftPopover = createDraftPopover(x, y, nodeId);
          layer.appendChild(draftPopover);
        }
      }

      function createThreadPopover(thread, index, pinX, pinY) {
        const popover = document.createElement('div');
        popover.className = 'comment-popover';

        const popoverWidth = 340;
        const vRect = viewport.getBoundingClientRect();
        const screenX = state.panX + pinX * state.zoom;
        let popoverX = pinX + 16;
        let popoverY = pinY - 12;

        if (screenX + popoverWidth * state.zoom > vRect.width - 20) {
          popoverX = pinX - popoverWidth - 16;
        }
        if (popoverX < 10) popoverX = 10;
        if (popoverY < 10) popoverY = 10;

        popover.style.left = `${popoverX}px`;
        popover.style.top = `${popoverY}px`;

        const isResolved = thread.status === 'resolved';
        const isThinking = state.agentTyping.has(thread.id);

        const headerHtml = `
          <div class="popover-header">
            <div class="popover-header-left">
              <span class="popover-number">#${index + 1}</span>
              ${thread.nodeId ? `<span class="popover-node-badge" title="Referenced Node">${escapeHtml(thread.nodeId)}</span>` : ''}
              ${isResolved ? '<span class="status-pill resolved">Resolved</span>' : ''}
            </div>
            <div class="popover-header-actions">
              ${!isResolved ? `<button class="btn-resolve" title="Mark as resolved">✓ Resolve</button>` : ''}
              <button class="btn-popover-close" title="Close">✕</button>
            </div>
          </div>
        `;

        let messagesHtml = '<div class="popover-messages">';
        (thread.messages || []).forEach(msg => {
          const isAgent = msg.author === 'agent';
          const avatar = isAgent ? '🤖' : '👤';
          const authorName = isAgent ? 'Super Dev' : 'You';
          const timeStr = formatTime(msg.createdAt);
          let bodyContent = '';
          if (isAgent) {
            bodyContent = window.marked && typeof marked.parse === 'function' ? marked.parse(msg.text) : escapeHtml(msg.text);
          } else {
            bodyContent = `<p>${escapeHtml(msg.text)}</p>`;
          }

          messagesHtml += `
            <div class="comment-message ${isAgent ? 'agent' : 'user'}">
              <div class="msg-header">
                <span class="msg-avatar">${avatar}</span>
                <span class="msg-author">${authorName}</span>
                <span class="msg-time">${timeStr}</span>
              </div>
              <div class="msg-body">${bodyContent}</div>
            </div>
          `;
        });

        if (isThinking) {
          messagesHtml += `
            <div class="agent-typing-indicator">
              <span class="typing-avatar">🤖</span>
              <span class="typing-dots">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              </span>
              <span class="typing-text">Agent is thinking...</span>
            </div>
          `;
        }
        messagesHtml += '</div>';

        const replyHtml = !isResolved ? `
          <div class="popover-reply">
            <textarea class="reply-textarea" placeholder="Reply to thread... (Enter to send, Shift+Enter for newline)" rows="2"></textarea>
            <div class="reply-actions">
              <button class="btn-reply-send">Send</button>
            </div>
          </div>
        ` : '';

        popover.innerHTML = headerHtml + messagesHtml + replyHtml;

        const closeBtn = popover.querySelector('.btn-popover-close');
        if (closeBtn) {
          closeBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            state.activeCommentId = null;
            renderComments();
          });
        }

        const resolveBtn = popover.querySelector('.btn-resolve');
        if (resolveBtn) {
          resolveBtn.addEventListener('click', async (ev) => {
            ev.stopPropagation();
            await resolveThread(thread.id);
          });
        }

        const replyTextarea = popover.querySelector('.reply-textarea');
        const replySendBtn = popover.querySelector('.btn-reply-send');

        const doReply = async () => {
          if (!replyTextarea) return;
          const text = replyTextarea.value.trim();
          if (!text) return;
          replyTextarea.value = '';
          await sendReply(thread.id, text);
        };

        if (replySendBtn) {
          replySendBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            doReply();
          });
        }

        if (replyTextarea) {
          replyTextarea.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' && !ev.shiftKey) {
              ev.preventDefault();
              doReply();
            } else if (ev.key === 'Escape') {
              ev.stopPropagation();
              state.activeCommentId = null;
              renderComments();
            }
          });
        }

        const msgsContainer = popover.querySelector('.popover-messages');
        if (msgsContainer) {
          requestAnimationFrame(() => {
            msgsContainer.scrollTop = msgsContainer.scrollHeight;
          });
        }

        return popover;
      }

      function createDraftPopover(x, y, nodeId) {
        const popover = document.createElement('div');
        popover.className = 'comment-popover draft-popover';

        const popoverWidth = 320;
        const vRect = viewport.getBoundingClientRect();
        const screenX = state.panX + x * state.zoom;
        let popoverX = x + 16;
        let popoverY = y - 12;

        if (screenX + popoverWidth * state.zoom > vRect.width - 20) {
          popoverX = x - popoverWidth - 16;
        }
        if (popoverX < 10) popoverX = 10;
        if (popoverY < 10) popoverY = 10;

        popover.style.left = `${popoverX}px`;
        popover.style.top = `${popoverY}px`;

        popover.innerHTML = `
          <div class="popover-header">
            <div class="popover-header-left">
              <span class="popover-number">New Comment</span>
              ${nodeId ? `<span class="popover-node-badge" title="Referenced Node">${escapeHtml(nodeId)}</span>` : ''}
            </div>
            <div class="popover-header-actions">
              <button class="btn-popover-close" id="btn-draft-close" title="Cancel (Esc)">✕</button>
            </div>
          </div>
          <div class="popover-body">
            <textarea id="draft-comment-text" class="reply-textarea" placeholder="Ask a question or critique this architecture... (Enter to send)" rows="3"></textarea>
            <div class="draft-actions">
              <button class="btn-cancel" id="btn-draft-cancel">Cancel</button>
              <button class="btn-submit" id="btn-draft-submit">Send</button>
            </div>
          </div>
        `;

        popover.querySelector('#btn-draft-close').addEventListener('click', (ev) => {
          ev.stopPropagation();
          cancelDraftComment();
        });
        popover.querySelector('#btn-draft-cancel').addEventListener('click', (ev) => {
          ev.stopPropagation();
          cancelDraftComment();
        });
        popover.querySelector('#btn-draft-submit').addEventListener('click', (ev) => {
          ev.stopPropagation();
          submitDraftComment();
        });

        const textarea = popover.querySelector('#draft-comment-text');
        textarea.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' && !ev.shiftKey) {
            ev.preventDefault();
            submitDraftComment();
          } else if (ev.key === 'Escape') {
            ev.stopPropagation();
            cancelDraftComment();
          }
        });

        return popover;
      }

      // ─── Pan & Zoom Canvas Engine ──────────────────────────────
      function updateTransform() {
        canvas.style.transform = `translate3d(${state.panX}px, ${state.panY}px, 0) scale(${state.zoom})`;
        btnZoomReset.textContent = `${Math.round(state.zoom * 100)}%`;
      }

      function zoomAt(factor, clientX, clientY) {
        const rect = viewport.getBoundingClientRect();
        const mouseX = (clientX !== undefined ? clientX : rect.left + rect.width / 2) - rect.left;
        const mouseY = (clientY !== undefined ? clientY : rect.top + rect.height / 2) - rect.top;

        const minZoom = 0.05;
        const maxZoom = 5.0;
        const newZoom = Math.min(Math.max(state.zoom * factor, minZoom), maxZoom);

        state.panX = mouseX - (mouseX - state.panX) * (newZoom / state.zoom);
        state.panY = mouseY - (mouseY - state.panY) * (newZoom / state.zoom);
        state.zoom = newZoom;
        updateTransform();
      }

      function fitToView() {
        const svg = canvas.querySelector('svg');
        if (!svg) return;

        let svgWidth = 0;
        let svgHeight = 0;

        try {
          const bbox = svg.getBBox();
          if (bbox && bbox.width > 0 && bbox.height > 0) {
            svgWidth = bbox.width;
            svgHeight = bbox.height;
          }
        } catch (e) {}

        if (!svgWidth || !svgHeight) {
          const wAttr = parseFloat(svg.getAttribute('width'));
          const hAttr = parseFloat(svg.getAttribute('height'));
          if (wAttr && hAttr) {
            svgWidth = wAttr;
            svgHeight = hAttr;
          } else {
            svgWidth = svg.clientWidth || 800;
            svgHeight = svg.clientHeight || 600;
          }
        }

        const vRect = viewport.getBoundingClientRect();
        const padX = 60;
        const padY = 60;

        const availableWidth = Math.max(vRect.width - padX * 2, 100);
        const availableHeight = Math.max(vRect.height - padY * 2, 100);

        const scaleX = availableWidth / svgWidth;
        const scaleY = availableHeight / svgHeight;
        const fitScale = Math.min(Math.max(Math.min(scaleX, scaleY), 0.1), 2.5);

        state.zoom = fitScale;
        state.panX = (vRect.width - svgWidth * state.zoom) / 2;
        state.panY = (vRect.height - svgHeight * state.zoom) / 2;
        updateTransform();
      }

      function resetZoom() {
        state.zoom = 1.0;
        const svg = canvas.querySelector('svg');
        if (svg) {
          const vRect = viewport.getBoundingClientRect();
          let svgWidth = svg.clientWidth || 800;
          let svgHeight = svg.clientHeight || 600;
          state.panX = (vRect.width - svgWidth) / 2;
          state.panY = (vRect.height - svgHeight) / 2;
        } else {
          state.panX = 0;
          state.panY = 0;
        }
        updateTransform();
      }

      // Spacebar Grab Tool & Comment Mode Hotkey
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          const tag = (e.target && e.target.tagName) || '';
          const isEditable = e.target && e.target.isContentEditable;
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isEditable) {
            if (!state.isSpacePressed) {
              e.preventDefault();
              state.isSpacePressed = true;
              document.body.classList.add('space-pressed');
            }
          }
        } else if (e.key === 'Escape') {
          if (state.draftComment) {
            cancelDraftComment();
            return;
          }
          if (state.activeCommentId) {
            state.activeCommentId = null;
            renderComments();
            return;
          }
          closeInspector();
        } else if (e.key === 'c' || e.key === 'C') {
          const tag = (e.target && e.target.tagName) || '';
          const isEditable = e.target && e.target.isContentEditable;
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !isEditable && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            toggleCommentMode();
          }
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
          e.preventDefault();
          toggleSidebar();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          state.isSpacePressed = false;
          document.body.classList.remove('space-pressed');
        }
      });

      // Mouse & Drag Panning Handlers
      viewport.addEventListener('mousedown', (e) => {
        // Left click with spacebar OR middle click (e.button === 1)
        if (e.button === 1 || (e.button === 0 && state.isSpacePressed)) {
          e.preventDefault();
          state.isDragging = true;
          state.dragStartX = e.clientX;
          state.dragStartY = e.clientY;
          state.lastMouseX = e.clientX;
          state.lastMouseY = e.clientY;
          state.dragDistance = 0;
          document.body.classList.add('is-dragging');
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.isDragging) return;
        const dx = e.clientX - state.lastMouseX;
        const dy = e.clientY - state.lastMouseY;
        state.panX += dx;
        state.panY += dy;
        state.lastMouseX = e.clientX;
        state.lastMouseY = e.clientY;
        state.dragDistance += Math.hypot(dx, dy);
        updateTransform();
      });

      window.addEventListener('mouseup', (e) => {
        if (state.isDragging) {
          state.isDragging = false;
          document.body.classList.remove('is-dragging');
        }
      });

      // Cursor-Centered Mouse Wheel, Trackpad Two-Finger Pan & Pinch Zoom (FigJam style)
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();

        // Zoom: Trackpad pinch gesture (e.ctrlKey) or Cmd/Ctrl + Wheel
        if (e.ctrlKey || e.metaKey) {
          // Gentle, smooth exponential zoom curve without jarring jumps
          const sensitivity = 0.0035;
          const clampedDelta = Math.max(-50, Math.min(50, e.deltaY));
          const factor = Math.exp(-clampedDelta * sensitivity);
          zoomAt(factor, e.clientX, e.clientY);
        } else {
          // Pan: Two-finger trackpad drag or standard wheel scroll
          if (e.shiftKey && !e.deltaX) {
            // Shift + scroll = horizontal pan
            state.panX -= e.deltaY;
          } else {
            state.panX -= e.deltaX;
            state.panY -= e.deltaY;
          }
          updateTransform();
        }
      }, { passive: false });

      // Prevent native browser pinch-zoom in Safari/WebKit
      viewport.addEventListener('gesturestart', (e) => e.preventDefault());
      viewport.addEventListener('gesturechange', (e) => e.preventDefault());
      viewport.addEventListener('gestureend', (e) => e.preventDefault());

      // Canvas Control Buttons (gentle 12% zoom steps)
      btnZoomIn.addEventListener('click', () => zoomAt(1.12));
      btnZoomOut.addEventListener('click', () => zoomAt(0.89));
      btnZoomReset.addEventListener('click', resetZoom);
      btnFitView.addEventListener('click', fitToView);

      // ─── Multi-Diagram Sidebar ─────────────────────────────────
      function toggleSidebar() {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        sidebar.classList.toggle('collapsed', state.sidebarCollapsed);
      }
      sidebarToggle.addEventListener('click', toggleSidebar);

      function updateSidebar() {
        diagramList.innerHTML = '';
        diagramCount.textContent = state.diagrams.length;

        state.diagrams.forEach((diagram) => {
          const li = document.createElement('li');
          li.className = 'diagram-item' + (diagram.id === state.activeId ? ' active' : '');
          li.setAttribute('data-id', diagram.id);

          const title = document.createElement('div');
          title.className = 'item-title';
          title.textContent = diagram.title || diagram.filename || diagram.id;

          const filename = document.createElement('div');
          filename.className = 'item-filename';
          filename.textContent = diagram.filename || `${diagram.id}.md`;

          li.appendChild(title);
          li.appendChild(filename);

          li.addEventListener('click', () => {
            if (state.activeId !== diagram.id) {
              selectDiagram(diagram.id, true);
            }
          });

          diagramList.appendChild(li);
        });
      }

      function selectDiagram(id, shouldFit = false) {
        const diagram = state.diagrams.find(d => d.id === id);
        if (!diagram) return;

        state.activeId = id;

        // Update Sidebar active item
        document.querySelectorAll('.diagram-item').forEach(el => {
          el.classList.toggle('active', el.getAttribute('data-id') === id);
        });

        // Update Topbar Document Badge
        activeDocBadge.textContent = diagram.filename || `${diagram.id}.md`;
        document.title = `${diagram.title || diagram.filename} — Super Dev`;

        // Sync with browser URL without full page reload
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('doc', diagram.filename || diagram.id);
          window.history.replaceState({ activeId: id }, '', url.toString());
        } catch (e) {}

        // Close Inspector on diagram change
        closeInspector();

        // Load comments for active diagram
        loadDocComments(diagram.filename || `${diagram.id}.md`);

        // Render Mermaid Diagram
        renderActiveDiagram(shouldFit);
      }

      // ─── Mermaid Rendering ─────────────────────────────────────
      let renderSeq = 0;
      async function renderActiveDiagram(shouldFit = false) {
        const diagram = state.diagrams.find(d => d.id === state.activeId);
        if (!diagram || !diagram.mermaid) {
          canvas.innerHTML = '';
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        const currentSeq = ++renderSeq;
        const renderId = `mermaid-canvas-${currentSeq}`;

        try {
          const { svg } = await mermaid.render(renderId, diagram.mermaid);
          if (currentSeq !== renderSeq) return; // Discard stale render
          canvas.innerHTML = svg;
          ensureCommentsLayer();
          renderComments();

          const svgEl = canvas.querySelector('svg');
          if (svgEl) {
            svgEl.style.overflow = 'visible';
            svgEl.style.display = 'block';
          }

          if (shouldFit) {
            requestAnimationFrame(() => fitToView());
          }
        } catch (err) {
          console.error('Mermaid render error:', err);
          canvas.innerHTML = `
            <div class="error-state">
              <h3>Mermaid Syntax Error</h3>
              <p>Unable to render diagram syntax for <code>${escapeHtml(diagram.filename)}</code>.</p>
              <pre>${escapeHtml(err.message || String(err))}</pre>
            </div>
          `;
        }
      }

      // ─── Node Inspector Drawer ─────────────────────────────────
      function closeInspector() {
        inspector.classList.remove('open');
        clearNodeHighlight();
      }
      inspectorClose.addEventListener('click', closeInspector);

      function clearNodeHighlight() {
        if (state.selectedNodeEl) {
          state.selectedNodeEl.classList.remove('node-selected');
          state.selectedNodeEl = null;
        }
        document.querySelectorAll('.node-selected').forEach(el => el.classList.remove('node-selected'));
      }

      function highlightNode(nodeEl) {
        clearNodeHighlight();
        nodeEl.classList.add('node-selected');
        state.selectedNodeEl = nodeEl;
      }

      function ensureNodeVisible(nodeEl) {
        const vRect = viewport.getBoundingClientRect();
        const nRect = nodeEl.getBoundingClientRect();
        const drawerWidth = 400; // inspector drawer width
        const drawerBoundary = vRect.right - drawerWidth;

        // If node's right edge is occluded or within 20px of the drawer
        if (nRect.right > drawerBoundary - 20) {
          const shift = nRect.right - (drawerBoundary - 40);
          state.panX -= shift;
          updateTransform();
        }
      }

      function findMatchingSection(candidateId, nodeText, diagram) {
        if (!diagram || !diagram.sections) return null;
        const sections = diagram.sections;

        // 1. Exact key match
        if (sections[candidateId]) return sections[candidateId];

        // 2. Case-insensitive key match
        const lowerCandidate = candidateId.toLowerCase();
        for (const [key, section] of Object.entries(sections)) {
          if (key.toLowerCase() === lowerCandidate) return section;
          if (section.id && section.id.toLowerCase() === lowerCandidate) return section;
        }

        // 3. Match by numeric prefix (e.g. node "5" or section "5. Placement Chain")
        const numMatch = candidateId.match(/^\d+$/) || (nodeText && nodeText.match(/^(\d+)[\.\s]/));
        if (numMatch) {
          const num = numMatch[1] || numMatch[0];
          for (const section of Object.values(sections)) {
            if (section.id === num || (section.title && section.title.startsWith(num + '.'))) {
              return section;
            }
          }
        }

        // 4. Match by title or label substring
        if (nodeText && nodeText.length > 2) {
          const lowerText = nodeText.toLowerCase();
          for (const section of Object.values(sections)) {
            const secTitle = (section.title || '').toLowerCase();
            if (secTitle.includes(lowerText) || lowerText.includes(secTitle)) {
              return section;
            }
          }
        }

        return null;
      }

      function extractNodeId(nodeEl) {
        // Flowchart node IDs: id="flowchart-A-12" or "flowchart-step1-55"
        const rawId = nodeEl.id || '';
        const match = rawId.match(/^flowchart-(.+)-\d+$/);
        if (match) return match[1];
        if (rawId.startsWith('flowchart-')) return rawId.replace(/^flowchart-/, '');
        if (rawId) return rawId;

        // Check data attributes
        const dataId = nodeEl.getAttribute('data-id');
        if (dataId) return dataId;

        return 'unknown-node';
      }

      function extractNodeText(nodeEl) {
        const labelEl = nodeEl.querySelector('.nodeLabel, .label') || nodeEl;
        return (labelEl.textContent || '').trim();
      }

      function openInspector(nodeEl) {
        highlightNode(nodeEl);

        const diagram = state.diagrams.find(d => d.id === state.activeId);
        const nodeId = extractNodeId(nodeEl);
        const nodeText = extractNodeText(nodeEl);
        const section = findMatchingSection(nodeId, nodeText, diagram);

        // Header details
        inspectorNodeId.textContent = nodeId;
        inspectorTitle.textContent = section?.title || nodeText || nodeId;

        // Status badge
        const status = (section?.status || 'existing').toLowerCase();
        inspectorStatus.textContent = status;
        inspectorStatus.className = 'status-badge ' + (
          status === 'new' ? 'new' :
          status === 'existing' ? 'existing' :
          status === 'deprecated' ? 'deprecated' : 'neutral'
        );

        // Body content rendered via Marked.js
        if (section && section.rawContent) {
          if (window.marked && typeof marked.parse === 'function') {
            inspectorBody.innerHTML = marked.parse(section.rawContent);
          } else {
            inspectorBody.textContent = section.rawContent;
          }
        } else if (section && section.summary) {
          if (window.marked && typeof marked.parse === 'function') {
            inspectorBody.innerHTML = marked.parse(section.summary);
          } else {
            inspectorBody.textContent = section.summary;
          }
        } else {
          inspectorBody.innerHTML = `
            <p class="muted-note">No specification notes documented in this file for node <code>${escapeHtml(nodeId)}</code>.</p>
          `;
        }

        inspector.classList.add('open');
        ensureNodeVisible(nodeEl);
      }

      // Viewport Click Handling: Comment Mode Placement vs Node Selection vs Background Click
      viewport.addEventListener('click', (e) => {
        // Drag suppression: > 4px movement is a pan, not a click
        if (state.dragDistance > 4) {
          state.dragDistance = 0;
          return;
        }
        state.dragDistance = 0;

        // Ignore clicks inside controls, inspector, header, comment pins, or popovers
        if (e.target.closest('#canvas-controls') || e.target.closest('#inspector') || e.target.closest('#header')) {
          return;
        }
        if (e.target.closest('.comment-pin') || e.target.closest('.comment-popover')) {
          return;
        }

        // ─── Comment Mode Click Handling ───
        if (state.commentModeActive) {
          const rect = canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) / state.zoom;
          const y = (e.clientY - rect.top) / state.zoom;

          // Detect if a node was clicked
          const nodeEl = e.target.closest('.node, .cluster, g[id^="flowchart-"], g[id]');
          let nodeId = null;
          if (nodeEl && canvas.contains(nodeEl)) {
            nodeId = extractNodeId(nodeEl);
          }

          openDraftComment(x, y, nodeId);
          return;
        }

        // ─── Normal Viewport Click Handling ───
        if (state.activeCommentId) {
          state.activeCommentId = null;
          renderComments();
        }

        const nodeEl = e.target.closest('.node, .cluster, g[id^="flowchart-"]');
        if (nodeEl && canvas.contains(nodeEl)) {
          openInspector(nodeEl);
        } else {
          closeInspector();
        }
      });

      // ─── Export Features ───────────────────────────────────────
      btnExportSvg.addEventListener('click', () => {
        const svg = canvas.querySelector('svg');
        if (!svg) {
          alert('No rendered diagram available to export.');
          return;
        }

        const clone = svg.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

        // Extract and inline stylesheet rules from document
        let styleContent = '';
        document.querySelectorAll('style').forEach((st) => {
          if (st.textContent && (st.textContent.includes('.node') || st.textContent.includes('mermaid') || (st.id && st.id.includes('mermaid')))) {
            styleContent += st.textContent + '\n';
          }
        });

        if (styleContent) {
          const styleEl = document.createElement('style');
          styleEl.textContent = styleContent;
          const defs = clone.querySelector('defs') || clone.insertBefore(document.createElementNS('http://www.w3.org/2000/svg', 'defs'), clone.firstChild);
          defs.appendChild(styleEl);
        }

        const serializer = new XMLSerializer();
        const svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(clone);
        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        const currentDoc = state.diagrams.find(d => d.id === state.activeId);
        a.download = `${currentDoc?.id || 'architecture'}.svg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      btnExportHtml.addEventListener('click', () => {
        // Generate self-contained standalone HTML bundle with embedded data
        const bundleData = {
          activeId: state.activeId,
          diagrams: state.diagrams
        };

        const docClone = document.documentElement.cloneNode(true);

        // Update embedded JSON script
        const dataScript = docClone.querySelector('#arch-data');
        if (dataScript) {
          dataScript.textContent = JSON.stringify(bundleData, null, 2);
        }

        // Close inspector in exported bundle
        const exportedInspector = docClone.querySelector('#inspector');
        if (exportedInspector) {
          exportedInspector.classList.remove('open');
        }

        const htmlString = '<!DOCTYPE html>\n' + docClone.outerHTML;
        const blob = new Blob([htmlString], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        const currentDoc = state.diagrams.find(d => d.id === state.activeId);
        a.download = `${currentDoc?.id || 'architecture'}-architecture.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      // ─── Live Server-Sent Events (SSE) ─────────────────────────
      function initLiveReload() {
        if (!window.EventSource) return;

        const sse = new EventSource('/events');

        sse.onopen = () => {
          liveDot.className = 'live-dot connected';
          liveText.textContent = 'Live';
        };

        sse.onerror = () => {
          liveDot.className = 'live-dot disconnected';
          liveText.textContent = 'Offline';
        };

        sse.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.type === 'file_change') {
              const idx = state.diagrams.findIndex(d => d.id === data.id);
              if (idx >= 0) {
                state.diagrams[idx] = data.diagram;
              } else {
                state.diagrams.push(data.diagram);
              }
              updateSidebar();

              // If modified diagram is active, re-render PRESERVING pan and zoom!
              if (state.activeId === data.id) {
                renderActiveDiagram(false /* do not reset view */);
              }
            } else if (data.type === 'dir_change') {
              state.diagrams = data.diagrams || [];
              updateSidebar();
              if (!state.diagrams.some(d => d.id === state.activeId) && state.diagrams.length > 0) {
                selectDiagram(state.diagrams[0].id, true);
              }
            } else if (data.type === 'comment_added') {
              if (data.thread) {
                addOrUpdateThread(data.thread);
                renderComments();
              }
            } else if (data.type === 'agent_typing') {
              if (data.commentId) {
                state.agentTyping.add(data.commentId);
                renderComments();
              }
            } else if (data.type === 'agent_reply') {
              if (data.commentId) {
                state.agentTyping.delete(data.commentId);
                const thread = state.comments.find(t => t.id === data.commentId);
                if (thread && data.message) {
                  if (!thread.messages.some(m => m.id === data.message.id)) {
                    thread.messages.push(data.message);
                  }
                }
                renderComments();
              }
            } else if (data.type === 'thread_resolved') {
              if (data.commentId) {
                state.agentTyping.delete(data.commentId);
                const thread = state.comments.find(t => t.id === data.commentId);
                if (thread) {
                  thread.status = 'resolved';
                }
                updateUnresolvedBadge();
                renderComments();
              }
            } else if (data.type === 'session_ended') {
              showToast('Discussion ended. Agent is compiling the Architecture Decision Record...');
              if (btnEndSession) {
                btnEndSession.classList.add('ended');
              }
            }
          } catch (err) {
            console.error('SSE message parsing error:', err);
          }
        };
      }

      // ─── Helpers ───────────────────────────────────────────────
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // ─── Startup Initialization ────────────────────────────────
      async function init() {
        let payload = null;

        // 1. Read from embedded <script id="arch-data">
        const dataScript = document.getElementById('arch-data');
        if (dataScript && dataScript.textContent.trim()) {
          try {
            payload = JSON.parse(dataScript.textContent);
          } catch (e) {
            console.warn('Failed to parse #arch-data:', e);
          }
        }

        // 2. Fallback to /api/diagrams if empty or absent
        if (!payload || !payload.diagrams || payload.diagrams.length === 0) {
          try {
            const res = await fetch('/api/diagrams');
            if (res.ok) {
              const diagrams = await res.json();
              payload = {
                activeId: diagrams[0]?.id || null,
                diagrams: diagrams
              };
            }
          } catch (e) {}
        }

        if (payload && payload.diagrams && payload.diagrams.length > 0) {
          state.diagrams = payload.diagrams;

          // Check URL query param ?doc=...
          const params = new URLSearchParams(window.location.search);
          const requestedDoc = params.get('doc');
          let targetId = payload.activeId;

          if (requestedDoc) {
            const match = state.diagrams.find(d => 
              d.filename === requestedDoc || 
              d.id === requestedDoc || 
              d.filename === `${requestedDoc}.md`
            );
            if (match) {
              targetId = match.id;
            }
          }

          if (!targetId && state.diagrams.length > 0) {
            targetId = state.diagrams[0].id;
          }

          updateSidebar();
          selectDiagram(targetId, true);
          const activeDiag = state.diagrams.find(d => d.id === targetId);
          if (activeDiag) {
            loadDocComments(activeDiag.filename || `${activeDiag.id}.md`);
          }
        } else {
          emptyState.style.display = 'block';
        }

        // Initialize Live SSE stream
        initLiveReload();
      }

      // Start application
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
